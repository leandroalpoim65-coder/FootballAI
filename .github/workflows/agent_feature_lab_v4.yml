name: FootballAI Autonomous Feature Lab V4

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agent/feature_lab.py"
      - "agent_feature_lab_cloud.py"
      - "tests/test_feature_lab.py"
      - ".github/workflows/agent_feature_lab_v4.yml"
  schedule:
    # Semanal: features precisam de acumular evidência; não faz sentido otimizar diariamente.
    - cron: "30 2 * * 1"

concurrency:
  group: footballai-autonomous-feature-lab-v4
  cancel-in-progress: false

jobs:
  feature-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run feature lab tests
        run: python -m unittest discover -s tests -p "test_feature_lab.py"

      - name: Run autonomous feature lab
        if: github.event_name != 'pull_request'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python agent_feature_lab_cloud.py
