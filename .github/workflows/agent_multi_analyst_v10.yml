name: FootballAI Multi-Analyst V10

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'agent/multi_analyst.py'
      - 'agent_multi_analyst_v10_cloud.py'
      - 'tests/test_multi_analyst.py'
      - '.github/workflows/agent_multi_analyst_v10.yml'

jobs:
  multi-analyst-v10:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Test multi-analyst
        run: python -m unittest discover -s tests -p "test_multi_analyst.py"
      - name: Run V10 walk-forward and final holdout
        if: github.event_name != 'pull_request'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python agent_multi_analyst_v10_cloud.py
