name: FootballAI Historical Blind Replay V6

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agent/historical_replay.py"
      - "agent_historical_replay_cloud.py"
      - "tests/test_historical_replay.py"
      - ".github/workflows/agent_historical_replay_v6.yml"
  schedule:
    - cron: "40 2 * * 1"

jobs:
  historical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Test outcome isolation
        run: python -m unittest discover -s tests -p "test_historical_replay.py"
      - name: Run blind historical replay
        if: github.event_name != 'pull_request'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python agent_historical_replay_cloud.py
