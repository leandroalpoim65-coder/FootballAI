name: FootballAI Closing Odds Cloud

on:
  workflow_dispatch:
  schedule:
    # Mantem maior cobertura nas horas tipicas de futebol europeu e reduz a madrugada.
    # Dias uteis: 30 em 30 min entre 16:20 e 22:50 UTC.
    - cron: "20,50 16-22 * * 1-5"
    # Fim de semana: 30 em 30 min entre 10:20 e 22:50 UTC.
    - cron: "20,50 10-22 * * 0,6"
    # Snapshots de seguranca fora das janelas principais, sem sobreposicoes.
    - cron: "50 0,4,8 * * *"
    - cron: "50 12 * * 1-5"

concurrency:
  group: footballai-closing-odds-cloud
  cancel-in-progress: false

jobs:
  refresh-closing-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Capture closing odds and snapshots in Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python closing_odds_v3_cloud.py
