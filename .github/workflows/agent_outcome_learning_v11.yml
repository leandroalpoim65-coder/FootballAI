name: FootballAI Outcome Learner V11

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'agent/outcome_learning.py'
      - 'agent_outcome_learning_v11_cloud.py'
      - 'tests/test_outcome_learning.py'
      - 'pages/2_Aprendizagem_V11.py'
      - '.github/workflows/agent_outcome_learning_v11.yml'
  schedule:
    # Results Cloud corre aos :25 e V10 aos :45; V11 aprende 10 min depois.
    - cron: "55 * * * *"
  pull_request:
    paths:
      - 'agent/outcome_learning.py'
      - 'agent_outcome_learning_v11_cloud.py'
      - 'tests/test_outcome_learning.py'
      - 'pages/2_Aprendizagem_V11.py'
      - '.github/workflows/agent_outcome_learning_v11.yml'

concurrency:
  group: footballai-outcome-learner-v11
  cancel-in-progress: false

jobs:
  outcome-learning:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile V11
        run: |
          python -m py_compile agent/outcome_learning.py agent_outcome_learning_v11_cloud.py
          python -m py_compile pages/2_Aprendizagem_V11.py

      - name: Test V11 outcome learner
        run: python -m unittest discover -s tests -p "test_outcome_learning.py"

      - name: Run V11 outcome learner
        if: github.event_name != 'pull_request'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python agent_outcome_learning_v11_cloud.py
