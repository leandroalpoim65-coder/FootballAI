name: FootballAI Autonomous Policy Learner V3

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agent/**"
      - "agent_chat_page.py"
      - "pages/1_Agente_IA.py"
      - "footballai_agent_cloud.py"
      - "agent_policy_learner_cloud.py"
      - "tests/test_decision_engine.py"
      - "tests/test_policy_store.py"
      - "tests/test_policy_learning.py"
      - "tests/test_agent_chat.py"
      - ".github/workflows/agent_policy_learning_v3.yml"
  schedule:
    # Corre depois da consolidacao diaria de performance.
    - cron: "15 4 * * *"

concurrency:
  group: footballai-autonomous-policy-learner-v3
  cancel-in-progress: false

jobs:
  learn-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run autonomous agent tests
        run: |
          python -m unittest discover -s tests -p "test_decision_engine.py"
          python -m unittest discover -s tests -p "test_policy_store.py"
          python -m unittest discover -s tests -p "test_policy_learning.py"
          python -m unittest discover -s tests -p "test_agent_chat.py"
          python -m py_compile pages/1_Agente_IA.py

      - name: Run autonomous policy learner
        if: github.event_name != 'pull_request'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python agent_policy_learner_cloud.py
