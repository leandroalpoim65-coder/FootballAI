name: FootballAI Upcoming Cloud

on:
  workflow_dispatch:
  schedule:
    - cron: "5 */12 * * *"

concurrency:
  group: footballai-upcoming-cloud
  cancel-in-progress: false

jobs:
  update-upcoming:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Update upcoming matches in Turso
        id: upcoming
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set +e
          python upcoming_football_data_cloud.py
          code=$?
          set -e

          if [ "$code" -eq 75 ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Football-Data temporariamente indisponível. Turso preservada; Paper Trade/Telegram ignorados."
            exit 0
          fi

          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi

          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Run Paper Trade in Turso
        if: steps.upcoming.outputs.updated == 'true'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python paper_trade_cloud.py

      - name: Notify new signals on Telegram
        if: steps.upcoming.outputs.updated == 'true'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_signals_cloud.py
