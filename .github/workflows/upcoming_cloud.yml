name: FootballAI Upcoming Cloud

on:
  workflow_dispatch:
  schedule:
    - cron: "5 */12 * * *"

concurrency:
  group: footballai-upcoming-cloud
  cancel-in-progress: false

jobs:
  update-upcoming:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Update domestic upcoming matches in Turso
        id: upcoming
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_FALLBACK_DAYS: "3"
          API_FOOTBALL_FALLBACK_MAX_REQUESTS: "16"
          ODDS_API_UPCOMING_RESERVE: "100"
          ODDS_API_UPCOMING_MAX_CALLS: "18"
        run: |
          set +e
          python upcoming_football_data_cloud.py
          code=$?
          set -e

          if [ "$code" -eq 75 ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Football-Data temporariamente indisponível. Turso doméstica preservada; UEFA ainda será tentada."
            exit 0
          fi

          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi

          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Sync UEFA Champions, Europa and Conference upcoming
        continue-on-error: true
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          UEFA_UPCOMING_DAYS: "7"
          UEFA_UPCOMING_MAX_REQUESTS: "28"
        run: python uefa_upcoming_cloud.py

      - name: Freeze V10 decisions from full upcoming universe
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python agent_v10_universe_cloud.py

      - name: Run Paper Trade with domestic + UEFA history
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python paper_trade_uefa_cloud.py

      - name: Run multi-market Goal Model shadow
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python goal_model_shadow_cloud.py

      - name: Notify new signals on Telegram
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_signals_cloud.py
