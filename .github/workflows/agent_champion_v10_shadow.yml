name: FootballAI V10 Champion Shadow

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'agent/champion_v10.py'
      - 'agent/multi_analyst.py'
      - 'agent_v10_universe_cloud.py'
      - 'tests/test_champion_v10.py'
      - 'tests/test_v10_universe.py'
      - 'requirements.txt'
      - '.github/workflows/agent_champion_v10_shadow.yml'
  schedule:
    # Segunda passagem: associa Paper Trade/CLV e atualiza resultados.
    - cron: "55 0,12 * * *"
  pull_request:
    paths:
      - 'agent/champion_v10.py'
      - 'agent/multi_analyst.py'
      - 'agent_v10_universe_cloud.py'
      - 'tests/test_champion_v10.py'
      - 'tests/test_v10_universe.py'
      - 'requirements.txt'
      - '.github/workflows/agent_champion_v10_shadow.yml'

concurrency:
  group: footballai-v10-champion-shadow
  cancel-in-progress: false

jobs:
  champion-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Test V10 champion and universe
        run: |
          python -m unittest discover -s tests -p "test_champion_v10.py"
          python -m unittest discover -s tests -p "test_v10_universe.py"

      - name: Run V10 full-universe prospective shadow
        if: github.event_name != 'pull_request'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python agent_v10_universe_cloud.py
