name: FootballAI Goal Model Multi-League Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

# Controlled research workflow: manual only so historical research never burns recurring Actions quota.
concurrency:
  group: footballai-goal-model-multileague-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile goal_model_multileague_backtest.py ml/goal_model.py
      - name: Run strict walk-forward multi-league test
        run: python goal_model_multileague_backtest.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: goal-model-multileague-reports
          path: |
            reports/goal_model_multileague_*.csv
            reports/goal_model_multileague_*.json
          if-no-files-found: error
      - name: Persist compact reports
        run: |
          git config user.name "footballai-bot"
          git config user.email "footballai-bot@users.noreply.github.com"
          git add reports/goal_model_multileague_summary.json \
                  reports/goal_model_multileague_probability_metrics.csv \
                  reports/goal_model_multileague_o25_replay.csv \
                  reports/goal_model_multileague_holdout_strategy.csv \
                  reports/goal_model_multileague_holdout_by_league.csv
          git diff --cached --quiet && exit 0
          git commit -m "Update Goal Model multi-league controlled results"
          git push
