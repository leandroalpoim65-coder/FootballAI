name: Validate Upcoming Fallback Chain

on:
  push:
    paths:
      - ".github/workflows/validate_upcoming_fallback_chain.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Syntax
        run: python -m py_compile upcoming_fallback_sources.py upcoming_football_data_cloud.py
      - name: Run updater with fallback chain
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_FALLBACK_DAYS: "3"
          API_FOOTBALL_FALLBACK_MAX_REQUESTS: "16"
          ODDS_API_UPCOMING_RESERVE: "100"
          ODDS_API_UPCOMING_MAX_CALLS: "18"
        run: |
          set +e
          python upcoming_football_data_cloud.py
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            echo "::warning::Todas as fontes indisponíveis; proteção funcionou."
            exit 0
          fi
          exit "$code"
