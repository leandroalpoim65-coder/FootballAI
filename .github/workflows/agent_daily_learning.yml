name: FootballAI Daily Learning Pipeline

on:
  workflow_dispatch:
  schedule:
    # Results consolidados as 03:25 e V11 as 03:55 UTC; aprendizagem agregada depois.
    - cron: "10 4 * * *"

concurrency:
  group: footballai-daily-learning
  cancel-in-progress: false

jobs:
  daily-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies once
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Performance monitor
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p "test_performance_monitor.py"
          python agent_performance_monitor_cloud.py

      - name: Policy learner
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p "test_decision_engine.py"
          python -m unittest discover -s tests -p "test_policy_store.py"
          python -m unittest discover -s tests -p "test_policy_learning.py"
          python -m unittest discover -s tests -p "test_agent_chat.py"
          python -m py_compile pages/1_Agente_IA.py
          python agent_policy_learner_cloud.py

      - name: Memory learner
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p "test_memory_learning.py"
          python agent_memory_learning_cloud.py

      - name: Broad behavior learner
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p "test_broad_behavior_learning.py"
          python agent_broad_behavior_learning_cloud.py
