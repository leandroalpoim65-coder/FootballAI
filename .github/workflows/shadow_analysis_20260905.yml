name: Shadow Analysis 2026-09-05

on:
  push:
    paths:
      - "shadow_analysis_20260905.py"
      - ".github/workflows/shadow_analysis_20260905.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shadow-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Analyze Turso shadow results
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python shadow_analysis_20260905.py
      - name: Publish analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadow_analysis_20260905.txt
          git diff --cached --quiet || git commit -m "Record shadow analysis snapshot"
          git push
