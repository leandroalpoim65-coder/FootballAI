name: Apply Upcoming Fallback Cleanup

on:
  push:
    paths:
      - ".github/workflows/apply_upcoming_fallback_cleanup.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Keep only 3-day emergency fallback horizon
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import libsql

          tz=ZoneInfo("Europe/Lisbon")
          today=datetime.now(tz).date()
          max_date=(today+timedelta(days=2)).isoformat()

          c=libsql.connect(
              database=os.environ["TURSO_DATABASE_URL"],
              auth_token=os.environ["TURSO_AUTH_TOKEN"],
          )

          before=c.execute("""
              SELECT COUNT(*) FROM upcoming_matches
              WHERE active=1
                AND source='The Odds API / emergency upcoming fallback'
          """).fetchone()[0]

          c.execute("""
              UPDATE upcoming_matches
              SET active=0
              WHERE source='The Odds API / emergency upcoming fallback'
                AND date > ?
                AND active=1
          """,(max_date,))
          c.commit()

          after=c.execute("""
              SELECT COUNT(*) FROM upcoming_matches
              WHERE active=1
                AND source='The Odds API / emergency upcoming fallback'
          """).fetchone()[0]

          total=c.execute("""
              SELECT COUNT(*) FROM upcoming_matches
              WHERE active=1
          """).fetchone()[0]

          print(f"EMERGENCY_ACTIVE_BEFORE={before}")
          print(f"EMERGENCY_ACTIVE_AFTER={after}")
          print(f"TOTAL_ACTIVE_AFTER={total}")
          print(f"HORIZON_END={max_date}")
          c.close()
          PY

      - name: Run Paper Trade on valid fallback window
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python paper_trade_cloud.py

      - name: Notify new signals on Telegram
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_signals_cloud.py
