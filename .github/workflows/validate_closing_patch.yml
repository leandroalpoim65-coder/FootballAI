name: Validate Closing Patch
on:
  push:
    paths:
      - ".github/workflows/validate_closing_patch.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m py_compile finalize_closing_quality_v2_cloud.py app_cloud.py app_cloud_v2.py app_cloud_v3.py closing_odds_v3_cloud.py
