name: FootballAI V12 Correction Stability

on:
  push:
    branches:
      - v12-calibrated-agent
    paths:
      - 'agent_v12_correction_stability_cloud.py'
      - '.github/workflows/agent_v12_correction_stability.yml'
  workflow_dispatch:

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile stability lab
        run: python -m py_compile agent_v12_correction_stability_cloud.py

      - name: Run correction stability walk-forward
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python agent_v12_correction_stability_cloud.py
