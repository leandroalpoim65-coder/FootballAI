name: Fix Recovered Snapshot Timestamps
on:
  push:
    paths:
      - "fix_recovered_snapshot_timestamps.py"
      - ".github/workflows/fix_recovered_snapshot_timestamps.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Fix
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python fix_recovered_snapshot_timestamps.py > fix_recovered_snapshot_timestamps.txt
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fix_recovered_snapshot_timestamps.txt
          git commit -m "Record recovered snapshot timestamp fix" || true
          git push
