name: FootballAI V12 Calibrated Shadow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v12-calibrated-agent
    paths:
      - 'agent/v12_calibrated.py'
      - 'agent/v12_history.py'
      - 'agent/v12_dataset.py'
      - 'agent/v12_modeling.py'
      - 'agent_v12_train_cloud.py'
      - 'agent_v12_shadow_cloud.py'
      - 'tests/test_v12_calibrated.py'
      - '.github/workflows/agent_v12_calibrated_shadow.yml'
  schedule:
    - cron: '15 */6 * * *'

concurrency:
  group: footballai-v12-calibrated-shadow
  cancel-in-progress: false

jobs:
  v12:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest

      - name: Compile V12
        run: |
          python -m py_compile agent/v12_calibrated.py agent/v12_history.py agent/v12_dataset.py agent/v12_modeling.py
          python -m py_compile agent_v12_train_cloud.py agent_v12_shadow_cloud.py

      - name: Test leakage guards and decision core
        run: python -m pytest -q tests/test_v12_calibrated.py

      - name: Evaluate challenger on feature branch
        if: github.ref != 'refs/heads/main'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python agent_v12_train_cloud.py

      - name: Run V12 calibrated shadow
        if: github.ref == 'refs/heads/main'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python agent_v12_shadow_cloud.py
