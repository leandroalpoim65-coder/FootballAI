name: FootballAI V12 Research Labs

on:
  workflow_dispatch:
  push:
    branches:
      - v12-calibrated-agent
    paths:
      - 'agent/v12_calibrated.py'
      - 'agent/v12_history.py'
      - 'agent/v12_dataset.py'
      - 'agent/v12_modeling.py'
      - 'agent/v12_rich.py'
      - 'agent_v12_train_cloud.py'
      - 'agent_v12_feature_audit_cloud.py'
      - 'agent_v12_rich_lab_cloud.py'
      - 'agent_v12_market_correction_lab_cloud.py'
      - 'tests/test_v12_calibrated.py'
      - '.github/workflows/agent_v12_calibrated_shadow.yml'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest
      - name: Compile V12 research
        run: |
          python -m py_compile agent/v12_calibrated.py agent/v12_history.py agent/v12_dataset.py agent/v12_modeling.py agent/v12_rich.py
          python -m py_compile agent_v12_train_cloud.py agent_v12_feature_audit_cloud.py agent_v12_rich_lab_cloud.py agent_v12_market_correction_lab_cloud.py
      - name: Test leakage guards
        run: python -m pytest -q tests/test_v12_calibrated.py
      - name: Audit richer historical features
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python agent_v12_feature_audit_cloud.py
      - name: Compare rich historical features
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python agent_v12_rich_lab_cloud.py
      - name: Test market correction model
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python agent_v12_market_correction_lab_cloud.py
      - name: Evaluate historical challenger
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python agent_v12_train_cloud.py
