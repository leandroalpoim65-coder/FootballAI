name: Shadow Today Analysis 2026-09-06
on:
  push:
    paths:
      - 'shadow_today_analysis_20260906.py'
      - '.github/workflows/shadow_today_analysis_20260906.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Analyze
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python shadow_today_analysis_20260906.py > shadow_today_analysis_20260906.txt
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shadow_today_analysis_20260906.txt
          git commit -m 'Record Sep 6 shadow analysis' || true
          git push
