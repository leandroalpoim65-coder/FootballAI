name: FootballAI Autonomous Agent V1

on:
  workflow_dispatch:
  schedule:
    # Upcoming Cloud corre aos :05 de 12 em 12 horas.
    # O agente corre depois, com margem para o pipeline terminar.
    - cron: "45 0,12 * * *"

concurrency:
  group: footballai-autonomous-agent-v1
  cancel-in-progress: false

jobs:
  agent-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run decision engine unit tests
        run: python -m unittest discover -s tests -p "test_decision_engine.py"

      - name: Run autonomous agent in shadow mode
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python footballai_agent_cloud.py
