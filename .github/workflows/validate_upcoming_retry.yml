name: Validate Upcoming Retry

on:
  push:
    paths:
      - ".github/workflows/validate_upcoming_retry.yml"

jobs:
  validate-upcoming:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Test upcoming updater against Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set +e
          python upcoming_football_data_cloud.py
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            echo "::warning::Fonte indisponível tratada corretamente; Turso preservada."
            exit 0
          fi
          exit "$code"
