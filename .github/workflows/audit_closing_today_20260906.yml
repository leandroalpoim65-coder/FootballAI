name: Audit Closing Today 2026-09-06
on:
  push:
    paths:
      - "audit_closing_today_20260906.py"
      - ".github/workflows/audit_closing_today_20260906.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install libsql
      - name: Audit
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python audit_closing_today_20260906.py
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit_closing_today_20260906.txt
          git commit -m "Record closing audit Sep 6" || true
          git push
