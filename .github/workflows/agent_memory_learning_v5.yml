name: FootballAI Agent Learning V5 Memory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agent/memory_learning.py"
      - "agent_memory_learning_cloud.py"
      - "tests/test_memory_learning.py"
      - ".github/workflows/agent_memory_learning_v5.yml"
  schedule:
    - cron: "35 1,13 * * *"

concurrency:
  group: footballai-agent-learning-v5-memory
  cancel-in-progress: false

jobs:
  memory-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run memory learning tests
        run: python -m unittest discover -s tests -p "test_memory_learning.py"

      - name: Run Agent Learning V5 memory
        if: github.event_name != 'pull_request'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python agent_memory_learning_cloud.py
