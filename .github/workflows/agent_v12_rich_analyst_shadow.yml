name: FootballAI V12 Rich Analyst Shadow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v12-calibrated-agent
    paths:
      - 'agent/v12_calibrated.py'
      - 'agent/v12_dataset.py'
      - 'agent/v12_history.py'
      - 'agent/v12_modeling.py'
      - 'agent/v12_rich.py'
      - 'agent/v12_rich_production.py'
      - 'agent/v12_rich_batch.py'
      - 'agent_v12_rich_shadow_cloud.py'
      - 'agent_v12_rich_resilient_cloud.py'
      - 'pages/3_V12_Rich.py'
      - 'tests/test_v12_rich_production.py'
      - '.github/workflows/agent_v12_rich_analyst_shadow.yml'
  schedule:
    - cron: '58 * * * *'

jobs:
  rich-analyst:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest

      - name: Compile V12 Rich Analyst
        run: python -m py_compile agent/v12_rich_production.py agent/v12_rich_batch.py agent_v12_rich_shadow_cloud.py agent_v12_rich_resilient_cloud.py pages/3_V12_Rich.py

      - name: Test V12 Rich Analyst
        run: python -m pytest -q tests/test_v12_calibrated.py tests/test_v12_rich_production.py

      - name: Run prospective Rich Analyst
        if: github.ref == 'refs/heads/main'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python agent_v12_rich_resilient_cloud.py
