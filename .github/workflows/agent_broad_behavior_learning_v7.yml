name: FootballAI Broad Behavior Learning V7

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agent/broad_behavior_learning.py"
      - "agent_broad_behavior_learning_cloud.py"
      - "tests/test_broad_behavior_learning.py"
      - ".github/workflows/agent_broad_behavior_learning_v7.yml"

jobs:
  broad-behavior-learning:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Test broad learning isolation
        run: python -m unittest discover -s tests -p "test_broad_behavior_learning.py"

      - name: Run broad behavior learning
        if: github.event_name != 'pull_request'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python agent_broad_behavior_learning_cloud.py
